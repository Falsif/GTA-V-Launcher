name: Сборка установщика Windows

on:
  workflow_dispatch:        # кнопка «Run workflow» во вкладке Actions
  push:
    tags: ["v*"]            # git tag v1.0.1 && git push --tags → релиз с установщиком

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Сборка (без релиза)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build

      - name: Сборка и релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GTA V Launcher ${{ github.ref_name }}"
          releaseBody: "Скачайте файл GTA.V.Launcher_*_x64-setup.exe и запустите его."
          releaseDraft: false

      - name: Загрузить установщик
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Launcher-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
